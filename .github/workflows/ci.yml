name: ci
on:
  pull_request:
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: |
          echo "go=$([ -f go.mod ] && echo 1)" >> "$GITHUB_OUTPUT"
          echo "app=$([ -f app/package.json ] && echo 1)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.go == '1'
        uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - if: steps.has.outputs.go == '1'
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          go vet ./...
          go test ./...
      - if: steps.has.outputs.app == '1'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - if: steps.has.outputs.app == '1'
        working-directory: app
        run: npm ci && npm run typecheck && npm test
