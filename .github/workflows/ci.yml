name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt'd:"; echo "$unformatted"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build layer8d (universal)
        run: |
          GOARCH=arm64 go build -o /tmp/layer8d-arm64 ./cmd/layer8d
          GOARCH=amd64 go build -o /tmp/layer8d-amd64 ./cmd/layer8d
          lipo -create -output /tmp/layer8d /tmp/layer8d-arm64 /tmp/layer8d-amd64 && lipo -info /tmp/layer8d
