name: Release

# Manual only: Actions → Release → Run workflow → 0.2.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check
      - name: Build darwin/arm64 binaries
        env:
          VERSION: ${{ inputs.version }}
        run: |
          flags="-X github.com/crashPopeye/layer8/internal/api.Version=$VERSION"
          GOOS=darwin GOARCH=arm64 go build -ldflags "$flags" -o out/layer8 ./cmd/layer8
          GOOS=darwin GOARCH=arm64 go build -ldflags "$flags" -o out/l8 ./cmd/l8
          tar -czf "out/layer8-$VERSION-darwin-arm64.tar.gz" -C out layer8 l8
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" "out/layer8-$VERSION-darwin-arm64.tar.gz" --target "$GITHUB_SHA" --title "layer8 v$VERSION" --generate-notes
