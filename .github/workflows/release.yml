name: Release

# Manual only: Actions → Release → Run workflow → 0.2.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check
      - name: Build layer8.app
        env:
          VERSION: ${{ inputs.version }}
        run: |
          build/app.sh
          ditto -c -k --keepParent build/out/layer8.app "build/out/layer8-$VERSION-darwin-arm64.zip"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" "build/out/layer8-$VERSION-darwin-arm64.zip" --target "$GITHUB_SHA" --title "layer8 v$VERSION" --generate-notes
